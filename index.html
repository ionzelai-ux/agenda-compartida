<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Agenda · Andrea y Jon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E40AF'/%3E%3Crect x='7' y='9' width='18' height='16' rx='2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M7 14h18M12 6v5M20 6v5' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<style>
:root{
  --az9:#1E3A8A;--az8:#1E40AF;--az7:#1D4ED8;--az6:#2563EB;--az5:#3B82F6;--az3:#93C5FD;--az2:#BFDBFE;--az1:#DBEAFE;--az0:#EFF6FF;
  --tx:#0F172A;--tx2:#334155;--mu:#64748B;--bd:#E2E8F0;--bd2:#CBD5E1;--sf:#F8FAFC;
  --rojo:#DC2626;--rojo1:#FEE2E2;--amb:#B45309;--amb1:#FEF3C7;--verde:#15803D;--verde1:#DCFCE7;
  --andrea:#1D4ED8;--jon:#0E7490;
  --sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a[data-act]{cursor:pointer;color:inherit;text-decoration:none}
a[data-act]:hover{color:var(--az6);text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.25}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- cabecera ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--az8);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;min-height:58px;box-shadow:0 2px 8px rgba(30,64,175,.25)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--az8);display:grid;place-items:center}
.brand b{display:block;font-size:15px}
.brand small{display:block;color:var(--az2);font-size:12px;margin-top:-2px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--az1);padding:8px 13px;border-radius:8px;white-space:nowrap;font-weight:600}
.tab:hover{background:rgba(255,255,255,.13);color:#fff}
.tab.on{background:#fff;color:var(--az8)}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;padding:7px 11px;border-radius:8px;font-weight:600;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.13)}
.tbtn.sol{background:#fff;color:var(--az8);border-color:#fff}
.tbtn.sol:hover{background:var(--az0)}
.ibtn{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:#fff}
.ibtn:hover{background:rgba(255,255,255,.13)}
.ibtn .badge{position:absolute;top:2px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#F59E0B;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.ibtn .badge[hidden]{display:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--az1);background:rgba(255,255,255,.1);border:0;border-radius:20px;padding:4px 10px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#94A3B8;display:block}
.sync.ok i{background:#4ADE80}.sync.sync i{background:#FBBF24}.sync.error i{background:#F87171}
.me{border:0;background:transparent;padding:2px;border-radius:50%}
.me .av{width:30px;height:30px;font-size:13px;box-shadow:0 0 0 2px #fff}

/* ---------- estructura ---------- */
main{max-width:1440px;margin:0 auto;padding:20px 20px 60px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh h1{font-size:22px;color:var(--az9)}
.vh p{margin:2px 0 0;color:var(--mu)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar .grow{flex:1}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:var(--sh)}
.card>h2{font-size:15px;color:var(--az9);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card>h2 .n{background:var(--az1);color:var(--az8);border-radius:10px;padding:0 8px;font-size:12px}
.card.c-venc>h2{color:var(--rojo)}.card.c-venc>h2 .n{background:var(--rojo1);color:var(--rojo)}
.empty{color:var(--mu);padding:18px;text-align:center;border:1px dashed var(--bd2);border-radius:10px;background:var(--sf)}
.empty.sm{padding:8px 10px;font-size:13px;text-align:left;border:0;background:none}
.hint{color:var(--mu);font-size:13px}

/* botones y filtros */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd2);background:#fff;color:var(--tx);padding:7px 12px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--az5);color:var(--az7)}
.btn.pri{background:var(--az6);border-color:var(--az6);color:#fff}
.btn.pri:hover{background:var(--az7);color:#fff}
.btn.del{color:var(--rojo);border-color:#FCA5A5}
.btn.del:hover{background:var(--rojo1)}
.lnk{border:0;background:none;color:var(--az6);font-weight:600;padding:0}
.segf{display:inline-flex;border:1px solid var(--bd2);border-radius:9px;overflow:hidden;background:#fff}
.segf button{border:0;background:none;padding:6px 12px;font-weight:600;color:var(--tx2);border-right:1px solid var(--bd)}
.segf button:last-child{border-right:0}
.segf button:hover{background:var(--az0)}
.segf button.on{background:var(--az6);color:#fff}
.inp,.sel{border:1px solid var(--bd2);border-radius:8px;padding:6px 10px;background:#fff;min-height:34px}
.inp:focus,.sel:focus,.fl input:focus,.fl select:focus,.fl textarea:focus{outline:2px solid var(--az3);outline-offset:0;border-color:var(--az5)}
.chkl{display:inline-flex;align-items:center;gap:6px;color:var(--tx2);font-size:13px}

/* chips */
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;flex:none;vertical-align:middle}
.av-andrea{background:var(--andrea)}.av-jon{background:var(--jon)}
.urg{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.urg-alta{background:var(--rojo1);color:var(--rojo)}
.urg-media{background:var(--amb1);color:var(--amb)}
.urg-baja{background:#F1F5F9;color:#475569}
.resp,.est,.ptag{font-size:12px;border-radius:6px;padding:1px 7px;white-space:nowrap;background:var(--az0);color:var(--az8);border:1px solid var(--az1)}
.est{background:#fff;color:var(--tx2);border-color:var(--bd)}
.ptag{background:#fff;color:var(--az7);border-color:var(--az2);font-weight:600}
.pl{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.pl-venc{background:var(--rojo);color:#fff}
.pl-hoy{background:var(--az6);color:#fff}
.pl-pronto{background:var(--az1);color:var(--az8)}
.pl-lejos{background:#F1F5F9;color:var(--tx2)}
.pl-nada{background:#fff;color:var(--mu);border:1px dashed var(--bd2)}
.pl-ok{background:var(--verde1);color:var(--verde)}
.pl-tarde{background:var(--amb1);color:var(--amb)}
.warn{font-size:12px;color:var(--amb);font-weight:600}

/* fila de tarea */
.tr{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.tr:hover{background:var(--az0);border-color:var(--az1)}
.tr+.tr{margin-top:2px}
.tr.nuevo{background:#FFFBEB;border-color:#FDE68A}
.tr-main{flex:1;min-width:0}
.tr-tit{font-weight:600;color:var(--tx);overflow-wrap:anywhere}
.tr.done .tr-tit{text-decoration:line-through;color:var(--mu)}
.tr-sub{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--mu)}

/* checks de ejecución y validación */
.cks{display:flex;gap:5px;flex:none;align-items:flex-start}
.ck{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd2);background:#fff;border-radius:7px;padding:3px 8px 3px 5px;font-size:12px;font-weight:600;color:var(--mu);white-space:nowrap}
.ck i{width:14px;height:14px;border-radius:4px;border:2px solid var(--bd2);display:grid;place-items:center;flex:none}
.ck:hover{border-color:var(--az5);color:var(--az7)}
.ck.on i::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck-ejecutada.on{background:var(--az0);border-color:var(--az6);color:var(--az7)}
.ck-ejecutada.on i{background:var(--az6);border-color:var(--az6)}
.ck-validada.on{background:var(--verde1);border-color:#4ADE80;color:var(--verde)}
.ck-validada.on i{background:var(--verde);border-color:var(--verde)}
.fase{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.f-ejecucion{background:#F1F5F9;color:var(--tx2)}
.f-validacion{background:#E0E7FF;color:#3730A3}
.f-terminada{background:var(--verde1);color:var(--verde)}
.ckl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--tx);cursor:pointer}
.ckl input{width:18px;height:18px;accent-color:var(--az6)}
.ckl small{color:var(--mu);font-weight:400;font-size:12px}
.estado-ck{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}

/* tablero por fases */
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kb-col{border:1px solid var(--bd);border-radius:12px;background:var(--sf);padding:10px;min-height:160px}
.kb-col>h3{font-size:14px;display:flex;align-items:center;gap:8px;margin:2px 4px 10px;color:var(--tx2)}
.kb-col>h3 .n{border-radius:10px;padding:0 8px;font-size:12px;background:#fff;border:1px solid var(--bd)}
.kb-col.k-ejecucion{border-top:4px solid #94A3B8}
.kb-col.k-validacion{border-top:4px solid #6366F1}
.kb-col.k-terminada{border-top:4px solid var(--verde)}
.kb-col .tr{background:#fff;border:1px solid var(--bd);margin-top:6px;flex-wrap:wrap}
.kb-col .tr:hover{border-color:var(--az3)}
.kb-col .hint{margin:-4px 4px 6px;font-size:12px}
.secc{margin-bottom:22px}
.secc>h2{font-size:15px;color:var(--tx2);display:flex;align-items:center;gap:8px;margin:0 0 10px 2px}
.secc>h2 .n{background:var(--az1);color:var(--az8);border-radius:10px;padding:0 8px;font-size:12px}
.secc>details>summary{cursor:pointer;font-size:15px;font-weight:600;color:var(--tx2);margin:0 0 10px 2px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;background:linear-gradient(180deg,#fff,var(--az0));box-shadow:var(--sh)}
.kpi b{display:block;font-size:26px;color:var(--az8);line-height:1.1}
.kpi span{color:var(--tx2);font-size:13px}
.kpi.k-rojo b{color:var(--rojo)}
.kpi.k-verde b{color:var(--verde)}

/* HOY */
.hoy-g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.hoy-g .col{display:grid;gap:16px}

/* PROYECTOS */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.pc{border:1px solid var(--bd);border-top:4px solid var(--az5);border-radius:12px;padding:14px 14px 12px;background:#fff;box-shadow:var(--sh)}
.pc.u-alta{border-top-color:var(--rojo)}.pc.u-media{border-top-color:#F59E0B}.pc.u-baja{border-top-color:#94A3B8}
.pc.done{opacity:.75}
.pc.nuevo{box-shadow:0 0 0 2px #FDE68A,var(--sh)}
.pc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pc-h h3{font-size:16px;color:var(--az9)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.pc-f{font-size:12.5px;color:var(--mu);margin-bottom:8px}
.prog{height:6px;border-radius:4px;background:var(--az1);overflow:hidden}
.prog i{display:block;height:100%;background:var(--az6);border-radius:4px}
.prog-t{font-size:12px;color:var(--mu);margin:4px 0 8px}
.pc-l{margin:0 -6px}
.pc-d{margin-top:6px}
.pc-d summary{cursor:pointer;color:var(--mu);font-size:13px;padding:4px 4px}
.quick-add{width:100%;margin-top:8px;border:1px dashed var(--bd2);border-radius:8px;padding:8px 10px;background:var(--sf)}
.quick-add:focus{outline:none;border-style:solid;border-color:var(--az5);background:#fff}

/* TAREAS */
.grp{margin-bottom:18px}
.grp>h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:0 0 6px 4px;display:flex;gap:8px;align-items:center}
.grp.g-venc>h3{color:var(--rojo)}
.grp.g-hoy>h3{color:var(--az6)}
.lista{border:1px solid var(--bd);border-radius:12px;padding:6px;background:#fff}

/* CALENDARIO */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav h2{font-size:18px;color:var(--az9);margin-left:6px;min-width:220px}
.cal-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.us{border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--sf);max-height:calc(100vh - 190px);overflow:auto;position:sticky;top:76px}
.us h3{font-size:14px;color:var(--az9);display:flex;justify-content:space-between}
.us h3 span{background:var(--az1);color:var(--az8);border-radius:10px;padding:0 8px;font-size:12px}
.us .hint{margin:4px 0 10px;font-size:12px}
.us-i{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--az5);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:grab}
.us-i:hover{border-color:var(--az3)}
.us-i b{display:block;font-size:13px}
.us-i small{color:var(--mu);font-size:12px}
.us-i.u-alta{border-left-color:var(--rojo)}.us-i.u-media{border-left-color:#F59E0B}.us-i.u-baja{border-left-color:#94A3B8}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin:-6px 0 12px}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.leyenda i{width:12px;height:12px;border-radius:3px;display:inline-block}

.tg{display:grid;overflow:auto;max-height:calc(100vh - 200px);border:1px solid var(--bd);border-radius:12px;background:#fff}
.tg-compact{max-height:560px}
.tg-c{border-bottom:1px solid var(--bd);border-left:1px solid var(--bd)}
.tg-h{position:sticky;top:0;z-index:6;background:#fff;padding:6px 8px;text-align:center;cursor:pointer}
.tg-h span{display:block;font-size:12px;color:var(--mu);text-transform:uppercase}
.tg-h b{font-size:18px;color:var(--tx2)}
.tg-h.hoy b{background:var(--az6);color:#fff;border-radius:50%;width:32px;height:32px;display:inline-grid;place-items:center}
.tg-g{position:sticky;left:0;z-index:5;background:#fff;border-left:0}
.tg-h.tg-g{z-index:7;cursor:default}
.tg-ad{min-height:34px;padding:3px;background:var(--sf)}
.tg-ad.tg-g{font-size:11px;color:var(--mu);display:flex;align-items:center;justify-content:center;text-align:center;background:var(--sf)}
.tg-gut{position:sticky;left:0;z-index:5;background:#fff}
.tg-gut .hl{position:absolute;right:6px;font-size:11px;color:var(--mu);transform:translateY(-7px)}
.tg-gut .hl:first-child{transform:none}
.tg-col{position:relative;border-left:1px solid var(--bd)}
.tg-col.hoy{background:#FAFCFF}
.slot{height:22px;border-bottom:1px dashed #EEF2F7}
.slot.s2{border-bottom:1px solid var(--bd)}
.slot:hover{background:var(--az0)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--rojo);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--rojo)}
.ev{position:absolute;z-index:2;border-radius:7px;padding:3px 7px;font-size:12px;overflow:hidden;cursor:pointer;border:1px solid rgba(30,64,175,.18);border-left:4px solid var(--az5);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:var(--tx2);font-size:11px}
.ev:hover{box-shadow:0 2px 8px rgba(30,64,175,.25);z-index:4}
.ev.done b{text-decoration:line-through;color:var(--mu)}
.ev-e{background:#fff;border:1.5px dashed var(--rojo);border-left-width:1.5px;color:var(--rojo);font-weight:600}
.r-jon{background:#CFFAFE}.r-andrea{background:var(--az1)}.r-ambos{background:#E0E7FF}
.ev.u-alta,.ci.u-alta,.mi.u-alta{border-left-color:var(--rojo)}
.ev.u-media,.ci.u-media,.mi.u-media{border-left-color:#F59E0B}
.ev.u-baja,.ci.u-baja,.mi.u-baja{border-left-color:#94A3B8}
.ci,.mi{font-size:12px;border-radius:6px;padding:2px 6px;margin:2px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--az5)}
.ci.done,.mi.done{text-decoration:line-through;color:var(--mu)}
.ci-e{background:#fff;border:1px dashed var(--rojo);color:var(--rojo);font-weight:600}
.ci-rv{background:#fff;border:1px dashed var(--az5);color:var(--az7)}
.ci-p{background:var(--az8);color:#fff;border-left-color:var(--az9);font-weight:600}
.mi-h{font-weight:700;color:var(--tx2);margin-right:3px}
.is-dragging .ev,.is-dragging .ci,.is-dragging .mi{pointer-events:none}
.drop.over{background:var(--az1)!important;outline:2px dashed var(--az5);outline-offset:-2px}
.dragging{opacity:.45}

.mg{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#fff}
.mg-h{display:grid;grid-template-columns:repeat(7,1fr);background:var(--sf);border-bottom:1px solid var(--bd)}
.mg-h div{padding:6px 8px;font-size:12px;text-transform:uppercase;color:var(--mu);font-weight:600}
.mg-b{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc{min-height:118px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:4px 5px;cursor:pointer;min-width:0}
.mc:nth-child(7n){border-right:0}
.mc:hover{background:var(--az0)}
.mc.out{background:var(--sf)}
.mc.out .mc-n{color:#94A3B8}
.mc-n{font-weight:700;color:var(--tx2);font-size:13px;display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px}
.mc-n:hover{background:var(--az1)}
.mc.hoy .mc-n{background:var(--az6);color:#fff}
.mc-mas{font-size:12px;color:var(--az6);font-weight:600;padding:1px 4px}

/* REVISIÓN */
.rv-p{border:1px solid var(--bd);border-radius:12px;margin-bottom:18px;background:#fff;box-shadow:var(--sh);overflow:hidden}
.rv-ph{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(90deg,var(--az0),#fff);border-bottom:1px solid var(--bd)}
.rv-pt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rv-pt h3{font-size:16px;color:var(--az9)}
.rv-pf{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--tx2)}
.rv-pf .lab{display:flex;align-items:center;gap:6px}
.rv-tw{overflow-x:auto}
.rv-t{width:100%;border-collapse:collapse;min-width:1240px}
.rv-t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mu);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--bd);background:#fff}

<script>
'use strict';
/* =========================================================
   CONSTANTES
   ========================================================= */
const USERS = {andrea:{n:'Andrea', i:'A'}, jon:{n:'Jon', i:'J'}};
const RESP = {jon:'Jon', andrea:'Andrea', ambos:'Ambos'};
const URG = {alta:'Urgente', media:'Media', baja:'Baja'};
const URG_ORD = {alta:0, media:1, baja:2};
const FASES = {ejecucion:'Pendiente de ejecución', validacion:'Pendiente de validación', terminada:'Terminados'};
const FASE_C = {ejecucion:'Por ejecutar', validacion:'Por validar', terminada:'Terminada'};
const DURS = {15:'15 min', 30:'30 min', 45:'45 min', 60:'1 h', 90:'1 h 30', 120:'2 h', 180:'3 h', 240:'4 h', 480:'Todo el día (8 h)'};
const H_INI = 7, H_FIN = 21, SLOT = 30, SLOT_PX = 22;
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* =========================================================
   ALMACENAMIENTO LOCAL
   ========================================================= */
const LSK = 'agenda_aj_';
function lsGet(k, def){ try{ const v = localStorage.getItem(LSK+k); return v == null ? def : JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(LSK+k, JSON.stringify(v)); }catch(e){} }

let ME = lsGet('yo', null);
let CFG = lsGet('cfg', {url:'', clave:''});
let DB = lsGet('db', {proyectos:{}, tareas:{}});
let DIRTY = lsGet('dirty', {proyectos:{}, tareas:{}});
let UI = Object.assign({vista:'hoy', resp:'todos', cal:'semana', calFecha:'', finde:false, q:'',
  turg:'todas', tproj:'', rvAtencion:false, verTerm:false}, lsGet('ui', {}));
UI.q = '';
function persist(){ lsSet('db', DB); lsSet('dirty', DIRTY); }
function guardarUI(){ lsSet('ui', UI); }
Object.values(DB.proyectos).concat(Object.values(DB.tareas)).forEach(normRec);

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy = () => iso(new Date());
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a, b){ return Math.round((parseISO(a) - parseISO(b)) / 864e5); }
function lunes(s){ const d = parseISO(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return iso(d); }
function fCorta(s){ if(!s) return ''; const d = parseISO(s); return DIAS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1); }
function fLarga(s){ const d = parseISO(s); return DIAS_L[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
function fTs(ts){ if(!ts) return ''; const d = new Date(ts); if(isNaN(d)) return ''; return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
const nowISO = () => new Date().toISOString();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const minToHM = m => pad(Math.floor(m/60))+':'+pad(m%60);
const hmToMin = s => { const [h,m] = String(s).split(':').map(Number); return (h||0)*60 + (m||0); };
const nombre = u => (USERS[u] && USERS[u].n) || u || '';
const otro = () => ME === 'andrea' ? 'jon' : 'andrea';
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800); }

/* =========================================================
   DATOS
   ========================================================= */
const proyectos = () => Object.values(DB.proyectos).filter(p => !p.borrado);
const tareas = () => Object.values(DB.tareas).filter(t => !t.borrado);
const tareasDe = pid => tareas().filter(t => t.proyecto_id === pid);
// Dos checks: ejecución completada y validación finalizada. Con los dos, está terminada.
const ejec = r => !!r.ejecutada;
const hecha = r => !!(r.ejecutada && r.validada);
const fase = r => hecha(r) ? 'terminada' : r.ejecutada ? 'validacion' : 'ejecucion';
const proyVivo = id => id && DB.proyectos[id] && !DB.proyectos[id].borrado;
const coincideResp = r => UI.resp === 'todos' || !r.responsable || r.responsable === UI.resp || r.responsable === 'ambos';
const filtrarResp = l => l.filter(coincideResp);
const nRep = r => (r.historial || []).filter(h => h.campo === 'fecha_entrega' && h.de).length;
const sortT = (a, b) => (a.fecha_entrega || '9999').localeCompare(b.fecha_entrega || '9999')
  || URG_ORD[a.urgencia || 'media'] - URG_ORD[b.urgencia || 'media']
  || (a.titulo || '').localeCompare(b.titulo || '');
const sortP = (a, b) => URG_ORD[a.urgencia || 'media'] - URG_ORD[b.urgencia || 'media']
  || (a.fecha_entrega || '9999').localeCompare(b.fecha_entrega || '9999')
  || (a.titulo || '').localeCompare(b.titulo || '');

function normRec(r){
  r.borrado = r.borrado === true || r.borrado === 'true';
  r.duracion = Number(r.duracion) || '';
  // Registros anteriores a los checks: se deducen del estado antiguo
  const viejoHecho = r.estado === 'hecha' || r.estado === 'terminado';
  if(r.ejecutada === '' || r.ejecutada == null) r.ejecutada = viejoHecho || r.estado === 'revision';
  else r.ejecutada = r.ejecutada === true || r.ejecutada === 'true';
  if(r.validada === '' || r.validada == null) r.validada = viejoHecho;
  else r.validada = r.validada === true || r.validada === 'true';
  if(!Array.isArray(r.comentarios)) r.comentarios = [];
  if(!Array.isArray(r.historial)) r.historial = [];
  return r;
}
function unir(a, b){
  const vistos = {}, out = [];
  (a || []).concat(b || []).forEach(x => { if(x && x.id && !vistos[x.id]){ vistos[x.id] = 1; out.push(x); } });
  return out.sort((x, y) => String(x.ts) < String(y.ts) ? -1 : 1);
}

function crear(k, o){
  const base = {id:uid(k === 'tareas' ? 't' : 'p'), proyecto_id:'', titulo:'', descripcion:'', urgencia:'media', estado:'pendiente',
    ejecutada:false, ejecutada_por:'', ejecutada_en:'', validada:false, validada_por:'', validada_en:'',
    responsable:'jon', fecha_inicio:'', hora_inicio:'', duracion:k === 'tareas' ? 60 : '', fecha_revision:'', fecha_entrega:'',
    hora_entrega:'', entrega_original:'', completada_en:'', creado_por:ME, creado_en:nowISO(), comentarios:[], historial:[], borrado:false};
  return guardarRec(k, Object.assign(base, o), null);
}
function actualizar(k, id, camb){
  const prev = DB[k][id];
  if(!prev) return;
  return guardarRec(k, Object.assign({}, prev, camb), prev);
}
function guardarRec(k, r, prev){
  if(prev){
    ['fecha_inicio', 'fecha_entrega'].forEach(f => {
      if((prev[f] || '') !== (r[f] || '')){
        r.historial = (r.historial || []).concat([{id:uid('h'), ts:nowISO(), por:ME, campo:f, de:prev[f] || '', a:r[f] || ''}]);
      }
    });
  }
  if(!r.entrega_original && r.fecha_entrega) r.entrega_original = r.fecha_entrega;
  // Validar implica ejecutar; quitar la ejecución quita la validación
  if(prev && prev.ejecutada && !r.ejecutada) r.validada = false;
  if(r.validada) r.ejecutada = true;
  ['ejecutada', 'validada'].forEach(f => {
    if(r[f] && !(prev && prev[f])){ r[f + '_en'] = r[f + '_en'] && !prev ? r[f + '_en'] : hoy(); r[f + '_por'] = r[f + '_por'] && !prev ? r[f + '_por'] : ME; }
    if(!r[f]){ r[f + '_en'] = ''; r[f + '_por'] = ''; }
  });
  r.estado = hecha(r) ? 'hecha' : r.ejecutada ? 'revision' : 'pendiente';
  r.completada_en = hecha(r) ? r.validada_en : '';
  r.actualizado_en = nowISO();
  r.actualizado_por = ME;
  DB[k][r.id] = r;
  DIRTY[k][r.id] = 1;
  persist();
  schedulePush();
  renderSoon();
  return r;
}

/* =========================================================
   SINCRONIZACIÓN CON GOOGLE SHEETS (Apps Script)
   ========================================================= */
let pushTimer = null, retryTimer = null, pulling = false;
function setSync(cls, txt){
  const b = $('#sync');
  b.className = 'sync ' + cls;
  b.querySelector('span').textContent = txt;
}
function nDirty(){ return Object.keys(DIRTY.proyectos).length + Object.keys(DIRTY.tareas).length; }
function schedulePush(){
  if(!CFG.url){ setSync('', 'Solo este equipo'); return; }
  clearTimeout(pushTimer);
  setSync('sync', 'Guardando…');
  pushTimer = setTimeout(push, 1200);
}
function push(){
  if(!CFG.url) return;
  const body = {token:CFG.clave, proyectos:[], tareas:[]};
  ['proyectos', 'tareas'].forEach(k => Object.keys(DIRTY[k]).forEach(id => { if(DB[k][id]) body[k].push(DB[k][id]); }));
  if(!body.proyectos.length && !body.tareas.length){ pull(); return; }
  setSync('sync', 'Guardando…');
  fetch(CFG.url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
    .then(() => setTimeout(() => pull(true), 1200))
    .catch(() => { setSync('error', 'Sin conexión'); reintentar(); });
}
function reintentar(){ if(!retryTimer) retryTimer = setTimeout(() => { retryTimer = null; push(); }, 20000); }
function jsonp(url, cb){
  const name = '__agcb' + Date.now() + Math.floor(Math.random()*1e4);
  const s = document.createElement('script');
  let done = false;
  const fin = () => { try{ delete window[name]; }catch(e){ window[name] = undefined; } s.remove(); clearTimeout(timer); };
  const timer = setTimeout(() => { if(done) return; done = true; fin(); cb(null, 'timeout'); }, 20000);
  window[name] = d => { if(done) return; done = true; fin(); cb(d, null); };
  s.onerror = () => { if(done) return; done = true; fin(); cb(null, 'error'); };
  s.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + name + '&t=' + Date.now();
  document.body.appendChild(s);
}
function urlApi(url, clave, action){ return url + (url.indexOf('?') > -1 ? '&' : '?') + 'action=' + action + '&token=' + encodeURIComponent(clave); }
function pull(trasPush){
  if(!CFG.url || pulling) return;
  pulling = true;
  if(!nDirty()) setSync('sync', 'Actualizando…');
  jsonp(urlApi(CFG.url, CFG.clave, 'all'), (d) => {
    pulling = false;
    if(!d){ setSync('error', 'Sin conexión'); reintentar(); return; }
    if(!d.ok){ setSync('error', d.error === 'token' ? 'Clave incorrecta' : 'Error del servidor'); return; }
    fusionar(d);
    if(nDirty()){
      setSync('sync', 'Pendiente de subir');
      if(trasPush) reintentar(); else schedulePush();
    } else setSync('ok', 'Sincronizado');
  });
}
// Mezcla lo que viene de la hoja con lo local. Si tengo un cambio local más reciente
// sin confirmar, lo conservo; en cuanto la hoja tiene mi versión, deja de estar pendiente.
function fusionar(d){
  let cambio = false;
  ['proyectos', 'tareas'].forEach(k => {
    (d[k] || []).forEach(raw => {
      if(!raw || !raw.id) return;
      const r = normRec(raw), l = DB[k][r.id];
      if(l && DIRTY[k][r.id]){
        if((l.actualizado_en || '') > (r.actualizado_en || '')){
          const c = unir(l.comentarios, r.comentarios);
          if(c.length !== (l.comentarios || []).length){ l.comentarios = c; cambio = true; }
          l.historial = unir(l.historial, r.historial);
          return;
        }
        delete DIRTY[k][r.id];
      }
      if(!l || JSON.stringify(l) !== JSON.stringify(r)){ DB[k][r.id] = r; cambio = true; }
    });
  });
  persist();
  if(cambio) renderSoon();
}

/* =========================================================
   NOVEDADES (lo que ha hecho la otra persona desde mi última visita)
   ========================================================= */
function visto(){ return ME ? lsGet('visto_' + ME, '') : ''; }
function esNovedad(r){ const v = visto(); return !!(v && r.actualizado_por && r.actualizado_por !== ME && (r.actualizado_en || '') > v); }
function novedades(){
  const v = visto(), out = [];
  if(!v || !ME) return out;
  ['proyectos', 'tareas'].forEach(k => Object.values(DB[k]).forEach(r => {
    if(r.borrado) return;
    const coms = (r.comentarios || []).filter(c => c.por !== ME && c.ts > v);
    coms.forEach(c => out.push({k, r, por:c.por, ts:c.ts, tipo:'comentó en', txt:c.txt}));
    if(r.actualizado_por && r.actualizado_por !== ME && (r.actualizado_en || '') > v){
      const soloComentario = coms.some(c => c.por === r.actualizado_por && Math.abs(new Date(c.ts) - new Date(r.actualizado_en)) < 3000);
      if(!soloComentario){
        const nuevo = r.creado_por !== ME && (r.creado_en || '') > v;
        out.push({k, r, por:r.actualizado_por, ts:r.actualizado_en, tipo:nuevo ? 'creó' : 'modificó'});
      }
    }
  }));
  return out.sort((a, b) => a.ts < b.ts ? 1 : -1);
}

function av(u, title){ if(!USERS[u]) return ''; return `<span class="av av-${u}" title="${esc(title || nombre(u))}">${USERS[u].i}</span>`; }
const avCreador = (r, gen) => av(r.creado_por, `Cread${gen || 'a'} por ${nombre(r.creado_por)} · ${fTs(r.creado_en)}`);

const chipResp = r => r ? `<span class="resp">Para ${RESP[r] || r}</span>` : '';
function plazo(r){
  const h = hoy();
  // El cumplimiento se mide con la fecha de ejecución frente a la de entrega
  if(ejec(r)){
    if(r.fecha_entrega && r.ejecutada_en){
      const d = diffDays(r.ejecutada_en, r.fecha_entrega);
      return d <= 0 ? {c:'ok', t:'✓ A tiempo'} : {c:'tarde', t:`✓ ${d} d tarde`};
    }
    return {c:'ok', t:'✓ Ejecutada'};
  }
  if(!r.fecha_entrega) return {c:'nada', t:'Sin fecha'};
  const d = diffDays(r.fecha_entrega, h);
  if(d < 0) return {c:'venc', t:`Vencida ${-d} d`};
  if(d === 0) return {c:'hoy', t:'Para hoy'};
  if(d === 1) return {c:'pronto', t:'Mañana'};
  if(d <= 7) return {c:'pronto', t:`En ${d} días`};
  return {c:'lejos', t:fCorta(r.fecha_entrega)};
}
const chipPlazo = r => { const p = plazo(r); return `<span class="pl pl-${p.c}">${p.t}</span>`; };
function fechasTxt(r){
  const a = [];
  if(r.fecha_inicio) a.push('Empieza ' + fCorta(r.fecha_inicio) + (r.hora_inicio ? ' ' + r.hora_inicio : ''));
  if(r.fecha_revision) a.push('Revisión ' + fCorta(r.fecha_revision));
  if(r.fecha_entrega) a.push('Entrega ' + fCorta(r.fecha_entrega) + (r.hora_entrega ? ' ' + r.hora_entrega : ''));

}

function itemsDia(date){

    if(t.fecha_inicio === date){
      if(t.hora_inicio) timed.push({k:'t', r:t, ini:hmToMin(t.hora_inicio), dur:Number(t.duracion) || 60, ent:mismoDia});
      else all.push({k:'t', r:t, ent:mismoDia});
    }
    if(t.fecha_entrega === date && !mismoDia){
      if(t.hora_entrega) timed.push({k:'e', r:t, ini:hmToMin(t.hora_entrega), dur:30});
      else all.push({k:'e', r:t});

function lanes(evs){
  evs.sort((a, b) => a.ini - b.ini || b.dur - a.dur);
  let grupo = [], fin = -1;
  const cerrar = () => {
    const cols = [];
    grupo.forEach(ev => { let i = cols.findIndex(c => c <= ev.ini); if(i < 0){ i = cols.length; cols.push(0); } cols[i] = ev.ini + ev.dur; ev.lane = i; });
    grupo.forEach(ev => ev.nl = cols.length);
    grupo = [];
  };
  evs.forEach(ev => { if(grupo.length && ev.ini >= fin) cerrar(); grupo.push(ev); fin = Math.max(fin, ev.ini + ev.dur); });
  if(grupo.length) cerrar();
  return evs;
}
function evBlock(ev){
  const t = ev.r, base = H_INI * 60;
  const top = Math.max(0, (ev.ini - base) / SLOT * SLOT_PX);
  const maxTop = (H_FIN * 60 - base) / SLOT * SLOT_PX;
  const hgt = Math.max(SLOT_PX - 2, Math.min(ev.dur / SLOT * SLOT_PX - 2, maxTop - top - 2));
  const w = 100 / ev.nl, l = ev.lane * w;
  const st = `top:${top}px;height:${hgt}px;left:calc(${l}% + 2px);width:calc(${w}% - 4px)`;
  const fin = minToHM(Math.min(ev.ini + ev.dur, 24 * 60 - 1));
  if(ev.k === 'e') return `<div class="ev ev-e" style="${st}" data-act="edit-t" data-id="${t.id}" title="Entrega a las ${minToHM(ev.ini)}: ${esc(t.titulo)}">⚑ ${minToHM(ev.ini)} ${esc(t.titulo)}</div>`;
  return `<div class="ev r-${t.responsable || 'ambos'} u-${t.urgencia || 'media'} ${hecha(t) ? 'done' : ''}" style="${st}" draggable="true" data-drag="${t.id}" data-act="edit-t" data-id="${t.id}"

function timeGrid(dias, compact){
  const h = hoy(), n = (H_FIN - H_INI) * 60 / SLOT, alto = n * SLOT_PX;
  let html = `<div class="tg ${compact ? 'tg-compact' : ''}" style="grid-template-columns:52px repeat(${dias.length},minmax(${dias.length > 1 ? 120 : 200}px,1fr))">`;
  html += `<div class="tg-c tg-h tg-g"></div>`;
  dias.forEach(d => { const D = parseISO(d); html += `<div class="tg-c tg-h ${d === h ? 'hoy' : ''}" ${compact ? '' : `data-act="goto-day" data-date="${d}"`} title="Ver el día"><span>${DIAS[D.getDay()]}</span><b>${D.getDate()}</b></div>`; });
  const items = dias.map(itemsDia);
  html += `<div class="tg-c tg-ad tg-g">Todo el día</div>`;
  dias.forEach((d, i) => { html += `<div class="tg-c tg-ad drop allday" data-date="${d}" data-act="new-at">${items[i].all.map(it => chipItem(it)).join('')}</div>`; });
  html += `<div class="tg-gut" style="height:${alto}px">`;
  for(let hh = H_INI; hh < H_FIN; hh++) html += `<div class="hl" style="top:${(hh - H_INI) * 2 * SLOT_PX}px">${pad(hh)}:00</div>`;
  html += `</div>`;
  dias.forEach((d, i) => {
    html += `<div class="tg-col ${d === h ? 'hoy' : ''}" style="height:${alto}px">`;
    for(let s = 0; s < n; s++) html += `<div class="slot drop ${s % 2 ? 's2' : ''}" data-date="${d}" data-time="${minToHM(H_INI * 60 + s * SLOT)}" data-act="new-at"></div>`;
    lanes(items[i].timed).forEach(ev => { html += evBlock(ev); });
    if(d === h){ const now = new Date(), m = now.getHours() * 60 + now.getMinutes(); if(m >= H_INI * 60 && m <= H_FIN * 60) html += `<div class="now" style="top:${(m - H_INI * 60) / SLOT * SLOT_PX}px"></div>`; }
    html += `</div>`;
  });
  return html + `</div>`;
}
function mesGrid(){
  const f = UI.calFecha || hoy(), D = parseISO(f), mes = D.getMonth(), h = hoy();
  const ini = lunes(iso(new Date(D.getFullYear(), mes, 1)));
  let html = `<div class="mg"><div class="mg-h">${['lun','mar','mié','jue','vie','sáb','dom'].map(x => `<div>${x}</div>`).join('')}</div><div class="mg-b">`;
  for(let i = 0; i < 42; i++){
    const d = addDays(ini, i), dd = parseISO(d);
    if(i % 7 === 0 && i >= 28 && dd.getMonth() !== mes) break;
    const it = itemsDia(d);
    const lista = it.timed.sort((a, b) => a.ini - b.ini).map(x => chipItem(x, 'mi', minToHM(x.ini))).concat(it.all.map(x => chipItem(x, 'mi')));
    html += `<div class="mc drop ${dd.getMonth() !== mes ? 'out' : ''} ${d === h ? 'hoy' : ''}" data-date="${d}" data-act="new-at">
      <span class="mc-n" data-act="goto-day" data-date="${d}" title="Ver el día">${dd.getDate()}</span>
      ${lista.slice(0, 4).join('')}${lista.length > 4 ? `<div class="mc-mas" data-act="goto-day" data-date="${d}">+${lista.length - 4} más</div>` : ''}</div>`;
  }
  return html + `</div></div>`;
}

/* =========================================================
   VISTA: REVISIÓN SEMANAL
   ========================================================= */
function atencion(t){
  const h = hoy(), dom = addDays(lunes(h), 6);
  if(hecha(t)) return false;
  if(fase(t) === 'validacion') return !t.fecha_revision || t.fecha_revision <= dom;
  return !t.fecha_entrega || t.fecha_entrega <= dom || (t.fecha_inicio && t.fecha_inicio < h);
}
function vRevision(){
  const h = hoy(), lun = lunes(h), dom = addDays(lun, 6), hace7 = addDays(h, -7);
  const todas = filtrarResp(tareas());
  const pend = todas.filter(t => !ejec(t)), porValidar = todas.filter(t => fase(t) === 'validacion');
  const hechas7 = todas.filter(t => hecha(t) && t.completada_en >= hace7);
  const aTiempo = hechas7.filter(t => plazo(t).c === 'ok').length;
  const visibles = t => (!hecha(t) || t.completada_en >= hace7) && (!UI.rvAtencion || atencion(t));
  const ps = proyectos().filter(p => (!hecha(p) || p.completada_en >= hace7) && (coincideResp(p) || tareasDe(p.id).some(coincideResp))).sort(sortP);
  let bloques = ps.map(p => {
    const ts = filtrarResp(tareasDe(p.id)).filter(visibles);
    if(UI.rvAtencion && !ts.length && !(!hecha(p) && plazo(p).c === 'venc')) return '';
    return rvBloque(p, ts);
  }).join('');
  const sueltas = todas.filter(t => !proyVivo(t.proyecto_id)).filter(visibles);
  if(sueltas.length) bloques += rvBloque(null, sueltas);
  return `<div class="vh"><div><h1>Revisión semanal</h1><p>Semana del ${fLarga(lun)} al ${fLarga(dom)} · Repasad lo pendiente, comprobad si se cumplieron las fechas y reprogramad.</p></div>
    <button class="btn pri" data-act="new-p">+ Nuevo proyecto</button></div>
  <div class="kpis">${kpi(pend.length, 'Pendientes de ejecución')}${kpi(porValidar.length, 'Pendientes de validación')}
    ${kpi(pend.filter(t => t.fecha_entrega && t.fecha_entrega < h).length, 'Vencidas', 'k-rojo')}
    ${kpi(pend.filter(t => t.fecha_entrega >= lun && t.fecha_entrega <= dom).length, 'Se entregan esta semana')}
    ${kpi(`${aTiempo}/${hechas7.length}`, 'Terminadas en 7 días (a tiempo)', 'k-verde')}
    ${kpi(pend.filter(t => nRep(t) > 0).length, 'Pendientes reprogramadas')}${kpi(pend.filter(t => !t.fecha_entrega).length, 'Sin fecha de entrega')}</div>
  <div class="bar">${filtroResp()}<label class="chkl"><input type="checkbox" data-ui="rvAtencion" ${UI.rvAtencion ? 'checked' : ''}> Solo lo que necesita atención (vencido, sin fecha, inicio pasado, o entrega/revisión esta semana)</label></div>
  ${bloques || `<div class="empty">No hay nada pendiente. ¡Buen trabajo!</div>`}`;
}

    <p class="hint" style="margin:0">Pega la URL de la aplicación web de Apps Script y la clave (TOKEN) de Code.gs. Sin conexión, la agenda solo guarda en este navegador.</p>
    <label class="fl">URL de la aplicación web<input id="cfg-url" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="fl">Clave<input id="cfg-clave" value="${esc(CFG.clave)}" placeholder="La misma que en TOKEN"></label>
    <div class="row"><button class="btn" data-act="probar">Probar conexión</button><span id="cfg-res" class="hint"></span></div>
    ${CFG.url ? `<div class="row"><button class="btn" data-act="copiar-enlace">Copiar enlace de acceso para ${nombre(otro()) || 'la otra persona'}</button><span class="hint">Lleva la conexión ya configurada.</span></div>` : ''}
    <h3>Copia de seguridad</h3>
    <div class="row"><button class="btn" data-act="backup">Descargar copia (JSON)</button>
      <span class="hint">${proyectos().length} proyectos · ${tareas().length} tareas · ${nDirty()} cambios pendientes de subir</span></div>
  </div>
  <div class="mf"><button class="btn pri" data-act="guardar-ajustes">${primera ? 'Empezar' : 'Guardar'}</button></div>`);
}

/* =========================================================
   NOVEDADES (panel)
   ========================================================= */
function abrirNov(){
  const p = $('#nov'), n = novedades();
  p.innerHTML = `<div class="nov-h"><b>Novedades de ${nombre(otro())}</b>${n.length ? '<button class="lnk" data-act="nov-visto">Marcar todo como visto</button>' : ''}</div>
    ${n.slice(0, 50).map(x => `<div class="nov-i" data-act="nov-open" data-k="${x.k}" data-id="${x.r.id}">${av(x.por)}<div>
      <div><b>${nombre(x.por)}</b> ${x.tipo} ${x.k === 'tareas' ? 'la tarea' : 'el proyecto'} <b>${esc(x.r.titulo)}</b></div>
      ${x.txt ? `<div class="nov-txt">«${esc(x.txt.length > 140 ? x.txt.slice(0, 140) + '…' : x.txt)}»</div>` : ''}<small>${fTs(x.ts)}</small></div></div>`).join('')
      || `<div class="empty sm" style="padding:14px">No hay novedades desde tu última visita.</div>`}`;
  p.hidden = false;
}

/* =========================================================
   RENDER
   ========================================================= */
let renderPend = false, renderDiferido = false;
function enEdicion(){
  const a = document.activeElement;
  return !!(a && $('#view').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox' && !a.dataset.ui);
}
function renderSoon(){
  if(renderPend) return;
  renderPend = true;
  setTimeout(() => { renderPend = false; if(enEdicion()){ renderDiferido = true; return; } render(); }, 0);
}
const VISTAS = {hoy:vHoy, proyectos:vProyectos, tareas:vTareas, calendario:vCalendario, revision:vRevision};
function render(){
  renderDiferido = false;
  if(!VISTAS[UI.vista]) UI.vista = 'hoy';
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.v === UI.vista));
  $('#me').innerHTML = ME ? av(ME, nombre(ME) + ' · Ajustes') : '<span class="av" style="background:#94A3B8">?</span>';
  const nn = novedades().length, badge = $('#nov-n');
  badge.hidden = !nn; badge.textContent = nn > 99 ? '99+' : nn;
  // conservar foco del buscador y scroll del calendario
  const a = document.activeElement, uiKey = a && a.dataset && a.dataset.ui, pos = uiKey && a.selectionStart;
  const tg = $('#view .tg'), scroll = tg ? [tg.scrollTop, tg.scrollLeft] : null;
  $('#view').innerHTML = VISTAS[UI.vista]();
  if(uiKey === 'q'){ const n = $('[data-ui="q"]'); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }
  const tg2 = $('#view .tg');
  if(tg2){
    if(scroll && render._vista === UI.vista + UI.cal){ tg2.scrollTop = scroll[0]; tg2.scrollLeft = scroll[1]; }
    else { const hh = Math.max(H_INI, Math.min(new Date().getHours() - 1, H_FIN - 6)); tg2.scrollTop = (hh - H_INI) * 2 * SLOT_PX; }
  }
  render._vista = UI.vista + UI.cal;
  const mp = $('#mp-tareas'); if(mp) mp.innerHTML = listaTareasProyecto(mp.dataset.pid);
  const cl = $('#com-list'); if(cl && DB[cl.dataset.k][cl.dataset.id]) cl.innerHTML = listaComs(DB[cl.dataset.k][cl.dataset.id]);
}
document.addEventListener('focusout', () => { if(renderDiferido) setTimeout(() => { if(renderDiferido && !enEdicion()) render(); }, 60); });

/* =========================================================
   ACCIONES
   ========================================================= */
function syncDq(box){
  const v = box.querySelector('input[type=date]').value;
  box.querySelectorAll('.qb').forEach(b => b.classList.toggle('on', v === addDays(hoy(), +b.dataset.q)));
}
function irA(vista){ UI.vista = vista; guardarUI(); $('#nov').hidden = true; render(); window.scrollTo(0, 0); }
const ACC = {
  vista: el => irA(el.dataset.v),
  ui: el => { UI[el.dataset.k] = el.dataset.v; guardarUI(); render(); },
  'new-t': () => formTarea(null, UI.vista === 'calendario' && UI.cal === 'dia' ? {fecha_inicio:UI.calFecha || hoy()} : {}),
  'new-p': () => formProyecto(null),
  'edit-t': el => formTarea(el.dataset.id),
  'edit-p': el => formProyecto(el.dataset.id),
  chk: el => {
    const {k, id, f} = el.dataset, r = DB[k][id];
    if(!r) return;
    const r2 = actualizar(k, id, {[f]: !r[f]});
    toast(r2[f] ? (hecha(r2) ? '¡Terminada! Pasa a Terminados' : 'Ejecutada · pendiente de validación') : (f === 'ejecutada' ? 'Vuelve a pendiente de ejecución' : 'Vuelve a pendiente de validación'));
  },
  'new-at': el => formTarea(null, {fecha_inicio:el.dataset.date, hora_inicio:el.dataset.time || ''}),
  'goto-day': el => { UI.vista = 'calendario'; UI.cal = 'dia'; UI.calFecha = el.dataset.date; guardarUI(); render(); },
  'cal-hoy': () => { UI.calFecha = hoy(); guardarUI(); render(); },
  'cal-nav': el => {
    const d = +el.dataset.d, f = UI.calFecha || hoy();
    if(UI.cal === 'dia') UI.calFecha = addDays(f, d);
    else if(UI.cal === 'semana') UI.calFecha = addDays(f, 7 * d);
    else { const D = parseISO(f); UI.calFecha = iso(new Date(D.getFullYear(), D.getMonth() + d, 1)); }
    guardarUI(); render();
  },
  'set-fecha': el => {
    const {k, id, f, v} = el.dataset, r = DB[k][id];
    if(!r) return;
    actualizar(k, id, {[f]: v === 'hoy' ? hoy() : addDays(r[f] || hoy(), 7)});
  },
  close: () => cerrarModal(),
  'save-t': () => guardarFormTarea(),
  'save-p': () => guardarFormProyecto(),
  'del-t': el => {
    const t = DB.tareas[el.dataset.id];
    if(t && confirm(`¿Borrar la tarea «${t.titulo}»?`)){ actualizar('tareas', t.id, {borrado:true}); cerrarModal(); toast('Tarea borrada'); }
  },
  'del-p': el => {
    const p = DB.proyectos[el.dataset.id], ts = tareasDe(el.dataset.id);
    if(p && confirm(`¿Borrar el proyecto «${p.titulo}»${ts.length ? ` y sus ${ts.length} tareas` : ''}?`)){
      ts.forEach(t => actualizar('tareas', t.id, {borrado:true}));
      actualizar('proyectos', p.id, {borrado:true}); cerrarModal(); toast('Proyecto borrado');
    }
  },
  'add-com': el => {
    const tx = $('#ctxt'), txt = tx.value.trim(), {k, id} = el.dataset;
    if(!txt || !DB[k][id]) return;
    actualizar(k, id, {comentarios:(DB[k][id].comentarios || []).concat([{id:uid('c'), ts:nowISO(), por:ME, txt}])});
    tx.value = '';
    $('#com-list').innerHTML = listaComs(DB[k][id]);
  },
  novedades: () => { if($('#nov').hidden) abrirNov(); else $('#nov').hidden = true; },
  'nov-visto': () => { lsSet('visto_' + ME, nowISO()); $('#nov').hidden = true; render(); },
  'nov-open': el => { $('#nov').hidden = true; if(el.dataset.k === 'tareas') formTarea(el.dataset.id); else formProyecto(el.dataset.id); },
  sync: () => { if(!CFG.url){ formAjustes(); return; } push(); },
  ajustes: () => formAjustes(),
  'set-yo': el => { document.querySelectorAll('.who-b').forEach(b => b.classList.toggle('on', b === el)); el.closest('.mb').dataset.yo = el.dataset.v; },
  probar: () => {
    const url = $('#cfg-url').value.trim(), clave = $('#cfg-clave').value.trim(), res = $('#cfg-res');
    if(url.indexOf('https://') !== 0){ res.textContent = 'La URL debe empezar por https://'; return; }
    res.textContent = 'Probando…';
    jsonp(urlApi(url, clave, 'ping'), d => {
      res.textContent = !d ? '✗ No responde. Revisa la URL y que la implementación sea «Cualquier usuario».'
        : d.ok ? `✓ Conectado a «${d.libro}».` : d.error === 'token' ? '✗ La clave no coincide con TOKEN.' : '✗ ' + d.error;
    });
  },
  'guardar-ajustes': () => {
    const box = $('#modal .mb'), yo = box.dataset.yo || ME;
    if(!yo){ toast('Elige quién eres'); return; }
    const url = $('#cfg-url').value.trim(), clave = $('#cfg-clave').value.trim();
    if(url && url.indexOf('https://') !== 0){ $('#cfg-res').textContent = 'La URL debe empezar por https://'; return; }
    if(yo !== ME){ ME = yo; lsSet('yo', ME); if(!lsGet('visto_' + ME, '')) lsSet('visto_' + ME, nowISO()); }
    const cambia = url !== CFG.url || clave !== CFG.clave;
    CFG = {url, clave}; lsSet('cfg', CFG);
    cerrarModal(); render();
    if(CFG.url){ if(cambia){ Object.keys(DB).forEach(k => Object.keys(DB[k]).forEach(id => { DIRTY[k][id] = 1; })); persist(); } push(); }
    else setSync('', 'Solo este equipo');
  },
  'copiar-enlace': () => {
    const datos = btoa(unescape(encodeURIComponent(JSON.stringify({url:CFG.url, clave:CFG.clave, yo:otro()}))));
    const link = location.origin + location.pathname + '#cfg=' + datos;
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Enlace copiado'), () => prompt('Copia este enlace:', link));
  },
  backup: () => {
    const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'agenda-copia-' + hoy() + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
};
document.addEventListener('click', e => {
  const nov = $('#nov');
  if(!nov.hidden && !e.target.closest('#nov') && !e.target.closest('[data-act="novedades"]')) nov.hidden = true;
  const q = e.target.closest('.dq [data-q]');
  if(q){ const box = q.closest('.dq'), inp = box.querySelector('input[type=date]'); inp.value = q.dataset.q === 'x' ? '' : addDays(hoy(), +q.dataset.q); syncDq(box); return; }
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const f = ACC[el.dataset.act];
  if(f){ e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.closest('.dq')) syncDq(el.closest('.dq'));
  if(el.form && (el.name === 'ejecutada' || el.name === 'validada')) syncChecksForm(el);
  if(el.dataset.ui === 'q'){ UI.q = el.value; render(); }
  if(el.classList.contains('err')) el.classList.remove('err');
});
document.addEventListener('change', e => {
  const el = e.target;
  if(!el.closest('#view')) return;
  if(el.dataset.ui && el.dataset.ui !== 'q'){ UI[el.dataset.ui] = el.type === 'checkbox' ? el.checked : el.value; guardarUI(); render(); return; }
  if(el.dataset.f && el.dataset.id){
    if(el.type === 'date' && el.value && el.value < '2000') return; // año a medio escribir
    el.blur();
    actualizar(el.dataset.k, el.dataset.id, {[el.dataset.f]: el.value});
  }
});
document.addEventListener('submit', e => { e.preventDefault(); if(e.target.id === 'ft') guardarFormTarea(); if(e.target.id === 'fp') guardarFormProyecto(); });
document.addEventListener('keydown', e => {
  const el = e.target;
  if(e.key === 'Enter' && el.classList && el.classList.contains('quick-add')){
    e.preventDefault();
    const titulo = el.value.trim();
    if(!titulo) return;
    const pid = el.dataset.proj || '', p = pid && DB.proyectos[pid];
    crear('tareas', {titulo, proyecto_id:pid, responsable:lsGet('ultResp', 'jon'), urgencia:p ? p.urgencia || 'media' : 'media'});
    el.value = '';
    toast('Tarea añadida');
    return;
  }
  if(e.key === 'Escape'){
    if(!$('#nov').hidden){ $('#nov').hidden = true; return; }
    if(!$('#modal').hidden && ME) cerrarModal();
    return;
  }
  if((e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey && $('#modal').hidden && !/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)){
    e.preventDefault(); ACC['new-t']();
  }
});

/* ---------- arrastrar y soltar en el calendario ---------- */
let dragId = null;
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-drag]');
  if(!el) return;
  dragId = el.dataset.drag;
  e.dataTransfer.setData('text/plain', dragId);
  e.dataTransfer.effectAllowed = 'move';
  el.classList.add('dragging');
  setTimeout(() => document.body.classList.add('is-dragging'), 0);
});
document.addEventListener('dragover', e => {
  if(!dragId) return;
  const d = e.target.closest && e.target.closest('.drop');
  if(!d) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if(!d.classList.contains('over')){ document.querySelectorAll('.drop.over').forEach(x => x.classList.remove('over')); d.classList.add('over'); }
});
document.addEventListener('drop', e => {
  if(!dragId) return;
  const d = e.target.closest && e.target.closest('.drop');
  if(!d) return;
  e.preventDefault();
  const t = DB.tareas[dragId], camb = {};
  if(t && d.dataset.fase){
    const f = d.dataset.fase;
    if(f !== fase(t)) actualizar('tareas', t.id, {ejecutada:f !== 'ejecucion', validada:f === 'terminada'});
  } else if(t){
    if(d.dataset.unsched){ camb.fecha_inicio = ''; camb.hora_inicio = ''; }
    else {
      camb.fecha_inicio = d.dataset.date;
      if(d.dataset.time) camb.hora_inicio = d.dataset.time;
      else if(d.classList.contains('allday')) camb.hora_inicio = '';
      if(!t.duracion) camb.duracion = 60;
    }
    if(camb.fecha_inicio !== t.fecha_inicio || camb.hora_inicio !== undefined && camb.hora_inicio !== t.hora_inicio) actualizar('tareas', t.id, camb);
  }
  finDrag();
});
document.addEventListener('dragend', finDrag);
function finDrag(){
  dragId = null;
  document.body.classList.remove('is-dragging');
  document.querySelectorAll('.drop.over,.dragging').forEach(x => x.classList.remove('over', 'dragging'));
}

/* =========================================================
   ARRANQUE
   ========================================================= */
(function leerEnlaceConfig(){
  const m = location.hash.match(/#cfg=([^&]+)/);
  if(!m) return;
  try{
    const c = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(c.url){ CFG = {url:c.url, clave:c.clave || ''}; lsSet('cfg', CFG); }
    if(c.yo && USERS[c.yo] && !ME){ ME = c.yo; lsSet('yo', ME); lsSet('visto_' + ME, nowISO()); }
  }catch(e){}
  history.replaceState(null, '', location.pathname + location.search);
})();
render();
if(!ME) formAjustes();
if(CFG.url){ nDirty() ? push() : pull(); } else setSync('', 'Solo este equipo');
setInterval(() => { if(!document.hidden && CFG.url) pull(); }, 30000);
setInterval(() => { if(!document.hidden && (UI.vista === 'calendario' || UI.vista === 'hoy')) renderSoon(); }, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && CFG.url) pull(); });
</script>
